name: Core MVP checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            jellyshops/package-lock.json
            backend/package-lock.json
      - run: npm ci
        working-directory: jellyshops
      - run: node scripts/prepare-shared-packages.mjs --check
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck && npm test -- --maxWorkers=2 && npm run build
        working-directory: backend
      - run: npm run typecheck && npm run lint && npm test -- --maxWorkers=2
        working-directory: jellyshops
      - run: npm run build
        working-directory: jellyshops
        env:
          NODE_ENV: production
  design-lint:
    # Measures every theme preview page at 3 widths against docs/design-contract.md (then the merchant-edit fuzz); fails on problems not in
    # jellyshops/e2e/design-lint.baseline.json. Non-blocking until it has passed on Linux once (the baseline was
    # recorded on Windows and font rendering differs); then remove continue-on-error.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jellyshops/package-lock.json
      - run: npm ci
        working-directory: jellyshops
      - run: npx playwright install --with-deps chromium
        working-directory: jellyshops
      - run: npx playwright test e2e/design-lint.spec.ts --reporter=line
        working-directory: jellyshops
        env:
          JELLY_E2E_FRONTEND_PORT: "3300"
      # Merchant-edit fuzz: every theme after merchant-style edits (sections moved, schemes swapped, fonts changed,
      # blocks removed) must still lay out and pass WCAG A/AA. Seeds 1-3; reproduce with /theme-preview/<id>?edits=<seed>.
      - run: npx playwright test e2e/merchant-edit-fuzz.spec.ts --reporter=line
        if: always()
        working-directory: jellyshops
        env:
          JELLY_E2E_FRONTEND_PORT: "3300"
          JELLY_EDIT_SEEDS: "1,2,3"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: design-lint-report
          path: jellyshops/test-results/design-lint-report.*
